[project]
name = "ashar-cli"
version = "0.1.1"
description = "Ashar Farooq's personal command-line tool."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ashar Farooq" }]
dependencies = [
    "typer>=0.12",
    "rich>=13",
]

[project.urls]
Homepage = "https://ashar.vercel.app"
Repository = "https://github.com/farooqashar/ashar-cli"

[project.scripts]
ashar = "ashar_cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ashar_cli"]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["ashar_cli"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ['if __name__ == "__main__":']
